name: Tests

on:
  push:
    branches:
      - refactor/schedule-engine
  pull_request:
    branches:
      - main
      - refactor/schedule-engine

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
