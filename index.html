<!DOCTYPE html>
<html lang="ch" id="html">

<head>
  <title>电子课表</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script type="text/javascript" src="js/scheduleConfig.js"></script>
  <script type="text/javascript" src="js/scheduleEngine.js"></script>
  <script type="text/javascript" src="js/scheduleConfigStore.js"></script>
  <script type="text/javascript" src="js/appStateStore.js"></script>
  <script type="text/javascript" src="js/index.js"></script>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <!-- QWeather Icons: https://icons.qweather.com/ (MIT source; icon designs CC BY 4.0) -->
  <link id="qweatherIconStylesheet" rel="stylesheet" href="node_modules/qweather-icons/font/qweather-icons.css">
</head>

<body>
  <div class="globalContainer" id="globalContainer">
    <div class="classContainer background" id="classContainer">
      <div class="class">加</div>
      <div class="class">载</div>
      <div class="class">中</div>
    </div>
    <div class="countdownContainer" id="countdownContainer">
      <div class="triangle"></div>
      <div class="countdowner" id="countdowner">
        <div class="currentClass" id="currentFullName">Loading</div>
        <div class="countdown" id="countdownText">00:00</div>
      </div>
    </div>
    <div class="leftSidebar sidebar background" id="leftSidebar"><span id="weekEN" class="t">Load</span><div class="corner options notIgnoreClick" id="weekCH">ing</div></div>
    <div class="rightSidebar sidebar background" id="rightSidebar"><span id="countdownDays" class="t">000</span><div class="corner">天</div></div>
  <section class="weatherPanel" id="weatherPanel" aria-live="polite" aria-label="天气信息">
    <div class="weatherCurrentColumn">
        <div class="weatherColumnTitle">当前天气</div>
        <div class="weatherCurrentRow">
          <i class="weatherIcon" id="weatherIcon" role="img" aria-label="天气图标"></i>
          <div class="weatherCurrent" id="weatherCurrent">--°</div>
        </div>
        <div class="weatherDescription" id="weatherDescription">等待天气数据</div>
      </div>
  </section>
  </div>
  <section id="examPanel" class="exam-panel notIgnoreClick" aria-live="polite" aria-label="考试计时面板" style="display:none">
    <div class="exam-panel-header">
      <div>
        <div class="exam-panel-eyebrow" id="examPanelEyebrow">考试进行中</div>
        <div class="exam-panel-title" id="examPanelTitle">考试</div>
      </div>
      <div class="exam-panel-state" id="examPanelState">计时中</div>
    </div>
    <div class="exam-panel-clock" id="examPanelClock">02:00:00</div>
    <div class="exam-panel-caption" id="examPanelCaption">剩余时间</div>
    <div class="exam-panel-pages" id="examPanelPages" style="display:none"></div>
    <div class="exam-panel-actions">
      <button type="button" id="examPanelPause" class="exam-panel-button notIgnoreClick">暂停</button>
      <button type="button" id="examPanelResume" class="exam-panel-button notIgnoreClick" style="display:none">继续</button>
      <button type="button" id="examPanelEnd" class="exam-panel-button exam-panel-button-danger notIgnoreClick">结束考试</button>
      <button type="button" id="examPanelExit" class="exam-panel-button notIgnoreClick" style="display:none">退出考试并恢复课表</button>
    </div>
  </section>
  <div class="miniCountdown" id="miniCountdown">00:00</div>

</body>
<script type="text/javascript" src="js/renderer.js"></script>


</html>
